[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-digest"
version = "0.1.0"
description = "Weekly Slack digests that teach a subject, not just report on it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "requests",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
topic-digest = "topic_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
